<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilha do Náufrago</title>
<style>
  :root {
    --mar: #1f6fa8;
    --texto: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--mar);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .painel { background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 6px; }
  .painel h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; opacity: 0.8; }
  #hud {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 12px;
    display: flex; flex-direction: column; gap: 8px;
    width: 190px;
  }
  .item { display: flex; justify-content: space-between; gap: 16px; margin: 2px 0; }
  .separador { border-top: 1px solid rgba(255,255,255,0.2); margin: 6px 0; }
  .ganho { color: #ffe27a; }
  .botao {
    margin-top: 6px; width: 100%; padding: 6px 8px;
    font: inherit; font-size: 14px;
    border: 2px solid var(--cor, #8fd16a); border-radius: 6px;
    background: transparent; color: #fff; cursor: pointer; text-align: left;
  }
  .botao.ativo { background: var(--cor, #8fd16a); color: #1b1b1b; font-weight: 600; }
  .botao:disabled { opacity: 0.4; cursor: not-allowed; }
  .botao:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #btnPlantar { --cor: #8fd16a; }
  #btnConstruir, .construcao { --cor: #e0a95a; }
  [hidden] { display: none !important; }
  #menuConstrucoes { max-height: calc(100vh - 330px); min-height: 120px; overflow-y: auto; }
  .construcao { display: block; }
  .construcao .nome { font-weight: 600; display: block; }
  .construcao .custo { font-size: 13px; opacity: 0.9; }
  .falta { color: #ffb0a0; }
  #painel {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: min(260px, calc(100% - 226px));
    min-width: 170px;
  }
  #painel h2 { font-size: 16px; opacity: 1; display: flex; justify-content: space-between; align-items: center; }
  #painel p { margin: 4px 0; font-size: 14px; line-height: 1.4; }
  #painel .botao { --cor: #f08bbd; }
  #btnFechar { background: none; border: 0; color: #fff; font-size: 18px; cursor: pointer; padding: 0 4px; }
  #dica {
    position: fixed; left: 50%;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    padding: 6px 12px; border-radius: 6px; font-size: 14px;
    pointer-events: none; max-width: calc(100% - 24px); text-align: center;
  }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="hud">
  <div class="painel">
    <h2>Inventário</h2>
    <div class="item"><span>🪵 Madeira</span><strong id="qtdMadeira">0</strong></div>
    <div class="item"><span>🌱 Sementes</span><strong id="qtdSementes">0</strong></div>
    <div class="item"><span>🍖 Carne</span><strong id="qtdCarne">0</strong></div>
    <div class="item"><span>🐟 Peixe</span><strong id="qtdPeixe">0</strong></div>
    <div class="item"><span>🌾 Trigo</span><strong id="qtdTrigo">0</strong></div>
    <div class="item"><span>🌾 Sementes de trigo</span><strong id="qtdSemTrigo">0</strong></div>
    <div class="separador"></div>
    <div class="item"><span>👩 Esposa</span><strong id="qtdEsposa">—</strong></div>
    <div class="item"><span>🧒 Filhos</span><strong id="qtdFilhos">0</strong></div>
    <div class="item"><span>🐾 Animais</span><strong id="qtdAnimais">0</strong></div>
    <button id="btnPlantar" class="botao" disabled>🌱 Plantar (P)</button>
    <button id="btnConstruir" class="botao">🔨 Construções (C)</button>
  </div>
  <div id="menuConstrucoes" class="painel" hidden>
    <h2>Construções</h2>
    <div id="listaConstrucoes"></div>
  </div>
</div>
<div id="painel" class="painel" hidden>
  <h2><span id="painelTitulo"></span><button id="btnFechar" aria-label="Fechar">×</button></h2>
  <div id="painelTexto"></div>
  <div id="painelBotoes"></div>
</div>
<div id="dica"></div>

<script>
// ===================== Configuração =====================
const MUNDO = { w: 1000, h: 1000 };
const ILHA = { x: 500, y: 500, raio: 330 };
const VELOCIDADE = 180;
const TEMPO_SERRAR = 5;
const TEMPO_PLANTAR = 2;
const TEMPO_PLANTAR_CRIANCA = 3;
const TEMPO_CRESCER = 60;
const TEMPO_NAMORAR = 3;
const TEMPO_GRAVIDEZ = 30;     // segundos até o bebê nascer
const TEMPO_CUIDAR_BEBE = 60;  // segundos até o bebê virar criança
const TEMPO_DESCANSO = 60;     // espera depois que o bebê vira criança para poder namorar de novo
const MADEIRA_POR_ARVORE = 20;
const SEMENTES_POR_ARVORE = 2;
const DISTANCIA_MIN_ARVORES = 45;
const RESERVA_SEMENTES = 4;
const TEMPO_CACAR = 3;
const TEMPO_EMPURRAR = 3;
const VELOCIDADE_JANGADA = 120;    // velocidade navegando no mar
const CARDUMES_MAX = 4;            // cardumes ao mesmo tempo no mar
const PEIXES_POR_CARDUME = 5;      // quantas pescas cada cardume aguenta
const TEMPO_PESCAR = 4;            // segundos por pesca
const PEIXES_POR_PESCA = 2;        // um peixe para cada adulto na jangada
const TEMPO_NOVO_CARDUME = 20;     // segundos para surgir um cardume novo
const PESCAS_POR_VIAGEM = 3;       // filhos voltam depois de pescar isso
const DESCANSO_VIAGEM = 30;        // segundos entre viagens dos filhos          // segundos empurrando a jangada para a água
const TEMPO_CRIA_ANIMAL = 45;     // segundos entre filhotes de um casal
const TEMPO_CRESCER_ANIMAL = 60;  // segundos para o filhote virar adulto
const MAX_POR_ESPECIE = 6;        // limite de animais de cada espécie na ilha
const MAX_COM_ABRIGO = 10;        // limite com galinheiro / curral / pasto
const TEMPO_TRIGO_CRESCER = 45;   // segundos para o trigo amadurecer
const TEMPO_PLANTAR_TRIGO = 1.5;
const TEMPO_COLHER_TRIGO = 2;
const TRIGO_POR_COLHEITA = 5;
const SEMENTES_TRIGO_INICIAIS = 1;      // ganha ao construir o campo
const SEMENTES_TRIGO_POR_COLHEITA = 2;  // cada canteiro colhido devolve 2 sementes

// Espécies: f = fêmea, m = macho
const ESPECIES = {
  ovelha:  { nome: { f: 'Ovelha', m: 'Carneiro' }, icone: { f: '🐑', m: '🐏' }, raio: 9,  carne: 15, velocidade: 40 },
  vaca:    { nome: { f: 'Vaca', m: 'Touro' },      icone: { f: '🐄', m: '🐂' }, raio: 13, carne: 30, velocidade: 30 },
  galinha: { nome: { f: 'Galinha', m: 'Galo' },    icone: { f: '🐔', m: '🐓' }, raio: 5,  carne: 5,  velocidade: 55 },
};    // a família não planta se isso deixar você com menos que isso

const CONSTRUCOES = {
  totem: {
    nome: 'Totem da Vida', icone: '🗿',
    custo: { madeira: 60, sementes: 4 },
    tempo: 8, raio: 16,
    largura: 36, altura: 75,      // área clicável / altura do desenho
    concluido: 'Totem da Vida construído!',
    desenhar: desenharTotem,
  },
  cabana: {
    nome: 'Cabana', icone: '🛖',
    custo: { madeira: 300 },
    tempo: 15, raio: 30,
    largura: 76, altura: 70,
    concluido: 'Cabana construída!',
    descricao: 'O primeiro lar da família na ilha.',
    desenhar: desenharCabana,
  },
  jangada: {
    nome: 'Jangada', icone: '🛶',
    custo: { madeira: 600 },
    tempo: 60, raio: 22,
    largura: 60, altura: 62,
    concluido: 'Jangada construída!',
    descricao: 'Uma jangada de troncos na beira do mar.',
    dica: 'A jangada só pode ser construída na areia, perto do mar. Esc para cancelar.',
    precisaAdolescente: true,   // um filho adolescente ajuda o pai na obra
    vaiParaAgua: true,          // depois de pronta é empurrada para o mar
    // só na faixa de areia, colada na água
    local: p => dentroDaIlha(p.x, p.y, 4) && !dentroDaIlha(p.x, p.y, 48),
    desenhar: desenharJangada,
  },
  // Abrigos de animais: área cercada (não bloqueia a passagem das pessoas)
  galinheiro: {
    nome: 'Galinheiro', icone: '🐔',
    custo: { madeira: 150 },
    tempo: 12, raio: 34, area: true, largura: 68, altura: 34, abrigo: 'galinha',
    concluido: 'Galinheiro construído!',
    descricao: 'Protege as galinhas e o galo. Limite de 10 galinhas e o dobro de carne por animal.',
    desenhar: (x, y, p, a) => desenharCercado(x, y, 34, '#b89a62', 'casinha', p, a),
  },
  curral: {
    nome: 'Curral', icone: '🐑',
    custo: { madeira: 250 },
    tempo: 15, raio: 44, area: true, largura: 88, altura: 44, abrigo: 'ovelha',
    concluido: 'Curral construído!',
    descricao: 'Protege as ovelhas e o carneiro. Limite de 10 ovelhas e o dobro de carne por animal.',
    desenhar: (x, y, p, a) => desenharCercado(x, y, 44, '#a88a55', 'cocho', p, a),
  },
  pasto: {
    nome: 'Pasto', icone: '🐄',
    custo: { madeira: 350 },
    tempo: 20, raio: 56, area: true, largura: 112, altura: 56, abrigo: 'vaca',
    concluido: 'Pasto construído!',
    descricao: 'Protege as vacas e o touro. Limite de 10 vacas e o dobro de carne por animal.',
    desenhar: (x, y, p, a) => desenharCercado(x, y, 56, '#7fbf55', 'cocho', p, a),
  },
  campoTrigo: {
    nome: 'Campo de trigo', icone: '🌾',
    custo: { madeira: 100 },
    tempo: 10, raio: 46, area: true, largura: 92, altura: 46,
    concluido: 'Campo de trigo pronto!',
    descricao: 'Área demarcada: o trigo só pode ser plantado aqui dentro.',
    desenhar: desenharCampoTrigo,
  },
};

// Pedidos que podem ser feitos aos deuses no Totem da Vida
const PEDIDOS = {
  esposa: {
    nome: 'Uma esposa', icone: '💍',
    custo: { madeira: 40, sementes: 4 },
    disponivel: () => !esposa,
    motivo: 'Você já tem uma esposa',
    realizar: pedirEsposa,
  },
  animal: {
    nome: 'Um animal', icone: '🐾',
    custo: { madeira: 30, sementes: 2 },
    disponivel: () => especiesIncompletas().length > 0,
    motivo: 'Todos os casais já estão completos',
    realizar: pedirAnimal,
  },
};

const canvas = document.getElementById('tela');
const ctx = canvas.getContext('2d');
const elDica = document.getElementById('dica');
const DICAS = {
  normal: 'Ande com setas / WASD ou tocando. Toque em árvores, construções, família ou animais.',
  plantar: 'Toque num lugar da grama para plantar. P ou Esc para sair.',
  construir: 'Toque num lugar da ilha para construir. Esc para cancelar.',
  navegando: 'Navegando: setas / WASD ou toque no mar. Pare em cima de um cardume para pescar. Perto da praia, E desembarca.',
};

// ===================== Inventário =====================
const inventario = { madeira: 0, sementes: 0, carne: 0, peixe: 0, trigo: 0, sementesTrigo: 0 };
const el = id => document.getElementById(id);
const elMadeira = el('qtdMadeira'), elSementes = el('qtdSementes');
const elEsposa = el('qtdEsposa'), elFilhos = el('qtdFilhos');
const elCarne = el('qtdCarne'), elAnimais = el('qtdAnimais'), elPeixe = el('qtdPeixe'), elTrigo = el('qtdTrigo'), elSemTrigo = el('qtdSemTrigo');
const btnPlantar = el('btnPlantar'), btnConstruir = el('btnConstruir');
const menuConstrucoes = el('menuConstrucoes'), listaConstrucoes = el('listaConstrucoes');
const ICONES = { madeira: '🪵', sementes: '🌱', carne: '🍖', peixe: '🐟', trigo: '🌾', sementesTrigo: '🌾 sem.' };

function piscar(e) { e.classList.add('ganho'); setTimeout(() => e.classList.remove('ganho'), 600); }
function temRecursos(custo) { return Object.entries(custo).every(([r, q]) => inventario[r] >= q); }
function gastarRecursos(custo) { for (const [r, q] of Object.entries(custo)) inventario[r] -= q; }
function textoCusto(custo) {
  return Object.entries(custo).map(([r, q]) =>
    `<span class="${inventario[r] < q ? 'falta' : ''}">${q} ${ICONES[r]}</span>`).join(' + ');
}

function atualizarInventario() {
  elMadeira.textContent = inventario.madeira;
  elSementes.textContent = inventario.sementes;
  elCarne.textContent = inventario.carne;
  elPeixe.textContent = inventario.peixe;
  elTrigo.textContent = inventario.trigo;
  elSemTrigo.textContent = inventario.sementesTrigo;
  elAnimais.textContent = animais.length;
  elEsposa.textContent = esposa ? 'sim' : '—';
  const adul = agentes.filter(a => a.tipo === 'adulto').length;
  const adol = agentes.filter(a => a.tipo === 'adolescente').length;
  const cri = agentes.filter(a => a.tipo === 'crianca').length;
  const partes = [];
  if (adul) partes.push(adul + ' 🧔');
  if (adol) partes.push(adol + ' 🧑');
  if (cri) partes.push(cri + ' 🧒');
  if (esposa && esposa.cuidado > 0) partes.push('1 👶');
  elFilhos.textContent = partes.length ? partes.join(' ') : '0';
  btnPlantar.disabled = inventario.sementes <= 0;
  if (modo.tipo === 'plantar' && inventario.sementes <= 0) definirModo(null);
  if (modo.tipo === 'construir' && !temRecursos(CONSTRUCOES[modo.construcao].custo)) definirModo(null);
  montarMenuConstrucoes();
  atualizarPainel();
}

// ===================== Níveis das construções =====================
// Cada evolução custa o dobro do nível anterior: nível 2 = 2x, nível 3 = 4x, nível 4 = 8x...
function estruturaDoTipo(id) { return estruturas.find(s => s.tipo === id); }
function custoEvolucao(s) {
  const base = CONSTRUCOES[s.tipo].custo, fator = Math.pow(2, s.nivel);
  return Object.fromEntries(Object.entries(base).map(([r, q]) => [r, q * fator]));
}
function emObra(id) {
  const t = jogador.tarefa;
  return t && (t.tipo === 'construir' || t.tipo === 'evoluir') && t.construcao === id;
}
function evoluir(id) {
  const s = estruturaDoTipo(id);
  if (!s || !temRecursos(custoEvolucao(s)) || !requisitosOk(id)) return;
  definirModo(null);
  abrirMenu(false);
  cancelar(jogador);
  if (jogador.embarcado) return;
  if (s.tipo === 'jangada') { prepararJangada(s); if (s.reservadaPor || s.tripulacao.length) return; }
  const noMar = !dentroDaIlha(s.x, s.y, 0);
  const pos = noMar ? pontoTerraPerto(s.x, s.y) : s;   // jangada no mar: trabalha a partir da praia
  iniciarTarefa(jogador, { tipo: 'evoluir', construcao: id, estrutura: s, x: pos.x, y: pos.y, raio: noMar ? 6 : s.raio });
}

function podeAjudarObra(a) { return (a.tipo === 'adolescente' || a.tipo === 'adulto') && !a.embarcado; }
function temAdolescente() { return agentes.some(podeAjudarObra); }
function requisitosOk(id) { return !CONSTRUCOES[id].precisaAdolescente || temAdolescente(); }
function textoRequisito(id) {
  if (!CONSTRUCOES[id].precisaAdolescente) return '';
  return `<br><span class="custo ${temAdolescente() ? '' : 'falta'}">Precisa de 1 filho adolescente ou adulto para ajudar</span>`;
}

function montarMenuConstrucoes() {
  listaConstrucoes.innerHTML = '';
  for (const [id, c] of Object.entries(CONSTRUCOES)) {
    const btn = document.createElement('button');
    btn.className = 'botao construcao';
    const existente = estruturaDoTipo(id);
    if (existente) {
      // Já construída: mostra a evolução para o próximo nível
      const custo = custoEvolucao(existente);
      const prox = existente.nivel + 1;
      btn.innerHTML = `<span class="nome">${c.icone} ${c.nome} · nível ${existente.nivel}</span>` +
        `<span class="custo">${emObra(id) ? 'Evoluindo...' : `Evoluir para nível ${prox}: ${textoCusto(custo)}`}</span>`;
      if (emObra(id)) btn.classList.add('ativo');
      btn.innerHTML += textoRequisito(id);
      btn.disabled = emObra(id) || !temRecursos(custo) || !requisitosOk(id);
      btn.addEventListener('click', () => evoluir(id));
    } else {
      if (modo.tipo === 'construir' && modo.construcao === id) btn.classList.add('ativo');
      btn.innerHTML = `<span class="nome">${c.icone} ${c.nome}</span>` +
        `<span class="custo">${emObra(id) ? 'Em construção...' : textoCusto(c.custo)}</span>`;
      btn.innerHTML += textoRequisito(id);
      btn.disabled = emObra(id) || !temRecursos(c.custo) || !requisitosOk(id);
      btn.addEventListener('click', () => definirModo('construir', id));
    }
    listaConstrucoes.appendChild(btn);
  }
}

// ===================== Modos =====================
const modo = { tipo: null, construcao: null };
function definirModo(tipo, construcao = null) {
  if (tipo && jogador.embarcado) return; // navegando não planta nem constrói
  if (tipo === 'plantar' && inventario.sementes <= 0) return;
  if (tipo === 'construir' && (!temRecursos(CONSTRUCOES[construcao].custo) || !requisitosOk(construcao))) return;
  modo.tipo = tipo; modo.construcao = construcao;
  btnPlantar.classList.toggle('ativo', tipo === 'plantar');
  btnPlantar.textContent = tipo === 'plantar' ? '🌱 Plantando... (P)' : '🌱 Plantar (P)';
  if (tipo) { abrirMenu(false); fecharPainel(); }
  elDica.textContent = (tipo === 'construir' && CONSTRUCOES[construcao].dica) || DICAS[tipo || (jogador.embarcado ? 'navegando' : 'normal')];
  montarMenuConstrucoes();
}
function abrirMenu(abrir = menuConstrucoes.hidden) {
  menuConstrucoes.hidden = !abrir;
  btnConstruir.classList.toggle('ativo', abrir);
  if (abrir) { montarMenuConstrucoes(); fecharPainel(); }
}
btnPlantar.addEventListener('click', () => definirModo(modo.tipo === 'plantar' ? null : 'plantar'));
btnConstruir.addEventListener('click', () => abrirMenu());

// ===================== Painel de interação =====================
// Cada painel é uma função que devolve { titulo, texto, botoes: [{ rotulo, desabilitado, acao }] }
const painel = el('painel');
let painelAtual = null, painelAssinatura = '';
function abrirPainel(render) { painelAtual = render; painelAssinatura = ''; abrirMenu(false); atualizarPainel(); painel.hidden = false; }
function fecharPainel() { painelAtual = null; painel.hidden = true; }
el('btnFechar').addEventListener('click', fecharPainel);
function atualizarPainel() {
  if (!painelAtual) return;
  const c = painelAtual();
  if (!c) { fecharPainel(); return; }
  // Só reconstrói se algo mudou (evita perder cliques)
  const assinatura = JSON.stringify([c.titulo, c.texto, c.botoes.map(b => [b.rotulo, b.desabilitado])]);
  if (assinatura === painelAssinatura) return;
  painelAssinatura = assinatura;
  el('painelTitulo').textContent = c.titulo;
  el('painelTexto').innerHTML = c.texto;
  const box = el('painelBotoes');
  box.innerHTML = '';
  for (const b of c.botoes) {
    const btn = document.createElement('button');
    btn.className = 'botao';
    btn.innerHTML = b.rotulo;
    btn.disabled = !!b.desabilitado;
    btn.addEventListener('click', b.acao);
    box.appendChild(btn);
  }
}

function painelTotem() {
  return {
    titulo: `🗿 Totem da Vida · nível ${(estruturaDoTipo('totem') || { nivel: 1 }).nivel}`,
    texto: '<p>Faça uma oferenda e peça algo aos deuses.</p>',
    botoes: Object.entries(PEDIDOS).map(([id, p]) => {
      const ok = p.disponivel();
      return {
        rotulo: `${p.icone} ${p.nome}<br><span class="custo" style="font-size:13px">${ok ? textoCusto(p.custo) : p.motivo}</span>`,
        desabilitado: !ok || !temRecursos(p.custo),
        acao: () => p.realizar(id),
      };
    }),
  };
}

function podeNamorar() {
  return esposa && esposa.gravidez <= 0 && esposa.cuidado <= 0 && esposa.descanso <= 0;
}
// Painel genérico para construções sem ações próprias (cabana, jangada...)
function painelEstrutura(est) {
  return () => {
    if (!estruturas.includes(est)) return null;
    const c = CONSTRUCOES[est.tipo];
    return { titulo: `${c.icone} ${c.nome} · nível ${est.nivel}`, texto: `<p>${c.descricao || ''}</p>`, botoes: [] };
  };
}

function painelEsposa() {
  if (!esposa) return null;
  let status = 'Trabalhando: corta árvores e planta sementes.';
  if (esposa.gravidez > 0) status = `🤰 Grávida. O bebê nasce em ${Math.ceil(esposa.gravidez)}s. Ela continua trabalhando.`;
  if (esposa.cuidado > 0) status = `🍼 Cuidando do bebê. Vira criança em ${Math.ceil(esposa.cuidado)}s. Enquanto isso ela não trabalha.`;
  if (esposa.descanso > 0) status = `⏳ Trabalhando. Pode ter outro filho em ${Math.ceil(esposa.descanso)}s.`;
  const namorando = jogador.tarefa && jogador.tarefa.tipo === 'namorar';
  if (namorando) status = '💕 Namorando...';
  const filhos = agentes.filter(a => a.tipo === 'crianca' || a.tipo === 'adolescente').length + (esposa.cuidado > 0 ? 1 : 0);
  return {
    titulo: '👩 Esposa',
    texto: `<p>${status}</p><p>Filhos: ${filhos}</p>`,
    botoes: [{
      rotulo: '💕 Namorar',
      desabilitado: !podeNamorar() || namorando || !!jogador.embarcado,
      acao: () => {
        cancelar(jogador);
        iniciarTarefa(jogador, { tipo: 'namorar', alvo: esposa, x: esposa.x, y: esposa.y, raio: esposa.raio });
      },
    }],
  };
}

const FASES = {

function painelFilho(c) {
